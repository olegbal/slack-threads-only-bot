# Slack app manifest: https://api.slack.com/apps -> Create New App -> From a manifest
# (for an existing app: App Manifest -> paste -> Save, then reinstall as a workspace owner/admin)
display_information:
  name: Threads Only
  description: Keeps channels threads-only; new topics are created via /new-topic.
features:
  bot_user:
    display_name: threads-only
    always_online: true
  slash_commands:
    - command: /new-topic
      description: Create a new topic in this channel
      usage_hint: "[topic text]"
      should_escape: false
oauth_config:
  scopes:
    bot:
      - channels:history # receive message events in public channels
      - groups:history # receive message events in private channels
      - chat:write # publish topics and ephemeral notices
      - commands # /new-topic
    user:
      - chat:write # chat.delete on behalf of the installing admin
settings:
  event_subscriptions:
    bot_events:
      - message.channels
      - message.groups
  interactivity:
    is_enabled: true # "Create topic" button and the topic modal
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
